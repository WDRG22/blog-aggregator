{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Aggregator</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
    <header>
        <h1>Blog Aggregator</h1>
        <nav>
            <!-- In a real app, you might have other links here -->
            {{if .User.ID}}
                <form hx-post="/users/logout" hx-target="body">
                    <button type="submit">Logout ({{.User.Name}})</button>
                </form>
            {{end}}
        </nav>
    </header>

    <main>
        {{template "content" .}}
    </main>

    <footer>
        <p>&copy; 2025</p>
    </footer>
</body>
</html>
{{end}}
